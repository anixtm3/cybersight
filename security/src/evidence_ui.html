<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSight - Evidence Documentation</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 15px; font-size: 14px; color: #9da7b1; }
  input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 16px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2ea043; }
  .entry { border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-top: 12px; background: #161b22; }
  .entry-meta { font-size: 12px; color: #9da7b1; }
  .error { color: #f85149; font-size: 13px; margin-top: 8px; }
  .config-note { font-size: 12px; color: #d29922; background: #2b2111; padding: 8px; border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>

<h1>CyberSight - Evidence Documentation</h1>
<p style="color:#9da7b1; font-size:14px;">Investigator case notes and action logging</p>

<div class="config-note" id="config-note"></div>

<label for="apiBase">Backend API base URL</label>
<input type="text" id="apiBase" placeholder="e.g. https://your-backend-url.com" value="">

<label for="authToken">JWT access token</label>
<input type="text" id="authToken" placeholder="Paste your access_token here">

<label for="caseId">Complaint / Case ID</label>
<input type="text" id="caseId" placeholder="e.g. CS-2026-00123">

<label for="entryType">Entry Type</label>
<select id="entryType">
  <option value="notes">Note</option>
  <option value="actions">Action</option>
</select>

<label for="notes">Content</label>
<textarea id="notes" rows="4" placeholder="Describe the note or action..."></textarea>

<button onclick="submitEntry()">Submit</button>
<div id="submit-error" class="error"></div>

<h2 style="margin-top:30px; font-size:16px;">Fetched Entries</h2>
<button onclick="fetchEntries()" style="background:#30363d">Refresh</button>
<div id="log"></div>
<div id="fetch-error" class="error"></div>

<script>
const API_BASE_KEY = "cybersight_api_base";
const savedBase = localStorage.getItem(API_BASE_KEY) || "";
document.getElementById("apiBase").value = savedBase;

const configNote = document.getElementById("config-note");
configNote.textContent = savedBase
  ? `Connected to: ${savedBase}`
  : "Backend URL not set yet - enter it above before submitting or fetching entries.";

document.getElementById("apiBase").addEventListener("change", (e) => {
  localStorage.setItem(API_BASE_KEY, e.target.value.trim());
  configNote.textContent = e.target.value.trim()
    ? `Connected to: ${e.target.value.trim()}`
    : "Backend URL not set yet - enter it above before submitting or fetching entries.";
});

function getConfig() {
  const base = document.getElementById("apiBase").value.trim().replace(/\/$/, "");
  const token = document.getElementById("authToken").value.trim();
  return { base, token };
}

async function submitEntry() {
  const errorEl = document.getElementById("submit-error");
  errorEl.textContent = "";

  const { base, token } = getConfig();
  const caseId = document.getElementById("caseId").value.trim();
  const entryType = document.getElementById("entryType").value;
  const notes = document.getElementById("notes").value.trim();

  if (!base) { errorEl.textContent = "Enter the backend API base URL first."; return; }
  if (!token) { errorEl.textContent = "Enter a JWT access token first."; return; }
  if (!caseId) { errorEl.textContent = "Enter a complaint/case ID first."; return; }
  if (!notes) { errorEl.textContent = "Enter some content first."; return; }

  const url = `${base}/api/complaints/${encodeURIComponent(caseId)}/${entryType}`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ content: notes }),
    });

    if (!response.ok) {
      const text = await response.text();
      errorEl.textContent = `Request failed (${response.status}): ${text}`;
      return;
    }

    document.getElementById("notes").value = "";
    fetchEntries();
  } catch (err) {
    errorEl.textContent = `Network error: ${err.message}`;
  }
}

  const errorEl = document.getElementById("fetch-error");
  errorEl.textContent = "";
  const log = document.getElementById("log");

  const caseId = document.getElementById("caseId").value.trim();
  const entryType = document.getElementById("entryType").value;

  if (!base || !token || !caseId) {
    errorEl.textContent = "Fill in backend URL, token, and case ID first.";
    return;
  }

  try {

      headers: { "Authorization": `Bearer ${token}` },
    });
